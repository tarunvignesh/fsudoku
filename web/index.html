        media="(prefers-color-scheme: light) and (device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">

  <title>Sudoku Trainer</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* The page is painted in the app's own colours before Flutter boots, so
       there is no white flash and no visible hand-off when it does. */
    :root {
      --bg: #F4F6FA;
      --grid: rgba(28, 32, 51, 0.16);
      --ink: rgba(28, 32, 51, 0.55);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0E1116;
        --grid: rgba(255, 255, 255, 0.14);
        --ink: rgba(255, 255, 255, 0.5);
      }
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      overscroll-behavior: none;
    }

    body {
      font: 500 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;

      /* Long press opens the pencil menu, so the browser must not treat it as
         a text selection or callout, and a double tap must not zoom. */
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      transition: opacity 260ms ease-out;
    }

    /* A 3x3 grid that fills itself in: the loading state says "Sudoku"
       without needing a logo asset or a spinner. */
    #boot .grid {
      display: grid;
      grid-template-columns: repeat(3, 20px);
      grid-template-rows: repeat(3, 20px);
      gap: 3px;
    }
    #boot .grid i {
      background: var(--grid);
      border-radius: 3px;
      animation: pulse 1.6s ease-in-out infinite;
    }
    #boot .grid i:nth-child(1) { animation-delay: 0ms; }
    #boot .grid i:nth-child(2) { animation-delay: 90ms; }
    #boot .grid i:nth-child(3) { animation-delay: 180ms; }
    #boot .grid i:nth-child(4) { animation-delay: 90ms; }
    #boot .grid i:nth-child(5) { animation-delay: 180ms; }
    #boot .grid i:nth-child(6) { animation-delay: 270ms; }
    #boot .grid i:nth-child(7) { animation-delay: 180ms; }
    #boot .grid i:nth-child(8) { animation-delay: 270ms; }
    #boot .grid i:nth-child(9) { animation-delay: 360ms; }

    @keyframes pulse {
      0%, 100% { opacity: 0.25; }
      50%      { opacity: 1; }
    }

    /* Respect a reduced-motion preference rather than animating regardless. */
    @media (prefers-reduced-motion: reduce) {
      #boot .grid i { animation: none; opacity: 0.6; }
      #boot { transition: none; }
    }

    #boot.done { opacity: 0; pointer-events: none; }

    /* Shown when a new build has been installed behind the running one. */
    #update {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translate(-50%, 140%);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px 10px 16px;
      border-radius: 12px;
      background: #1f2430;
      color: #e8eaf0;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
      transition: transform 260ms cubic-bezier(.2,.8,.2,1);
      z-index: 10;
    }
    #update.show { transform: translate(-50%, 0); }
    #update button {
      font: inherit;
      font-weight: 600;
      color: #0e1116;
      background: #8fb6ff;
      border: 0;
      border-radius: 8px;
      padding: 7px 12px;
      cursor: pointer;
    }
    @media (prefers-reduced-motion: reduce) {
      #update { transition: none; }
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="grid" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <p>Loading Sudoku Trainer</p>
  </div>

  <div id="update" role="status" hidden>
    <span>A new version is ready.</span>
    <button type="button" id="update-reload">Reload</button>
  </div>

  <script>
    // Offer the update rather than applying it mid-game.
    //
    // The service worker caches aggressively, so without this a returning
    // player can sit on a stale build for a whole session. Reloading without
    // asking would be worse: it would discard the board they are looking at.
    (function () {
      if (!('serviceWorker' in navigator)) return;
      var banner = document.getElementById('update');
      var button = document.getElementById('update-reload');

      // Registered here rather than left to Flutter: as of 3.47 Flutter's own
      // service worker is deprecated and the bootstrap no longer registers
      // it, so a stock build caches nothing and will not open offline.
      // Relative, so it keeps working under a sub-path such as /fsudoku/.
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {
          // No offline support then. Not worth bothering anyone about.
        });
      });

      function offer(worker) {
        banner.hidden = false;
        requestAnimationFrame(function () { banner.classList.add('show'); });
        button.onclick = function () {
          // The saved game is written on a short debounce, so give that a
          // moment to land before the page goes away.
          button.disabled = true;
          setTimeout(function () {
            if (worker) worker.postMessage({ type: 'SKIP_WAITING' });
            location.reload();
          }, 450);
        };
      }

      navigator.serviceWorker.getRegistration().then(function (reg) {
        if (!reg) return;
        if (reg.waiting) offer(reg.waiting);
        reg.addEventListener('updatefound', function () {
          var next = reg.installing;
          if (!next) return;
          next.addEventListener('statechange', function () {
            // A worker that installs while one is already controlling the
            // page is an update, not a first run.
            if (next.state === 'installed' && navigator.serviceWorker.controller) {
              offer(next);
            }
          });
        });
      });
    })();

    // Fade the boot screen once Flutter has painted its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('done');
      boot.addEventListener('transitionend', function () { boot.remove(); });
      // Belt and braces, in case the transition never fires.
      setTimeout(function () { boot.remove(); }, 800);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
