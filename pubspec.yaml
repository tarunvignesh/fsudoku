name: fsudoku
description: >-
  A Sudoku trainer that teaches the game. Play 4x4, 6x6 and 9x9 boards with
  live candidate marks, explained hints and immediate conflict feedback.
repository: https://github.com/conatarun/fsudoku
publish_to: none

version: 2.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

# No runtime dependencies. The solver, state management and UI are all built on
# the Dart and Flutter SDKs, which keeps the app buildable years from now.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Subset to printable ASCII at two weights each: the full families are about
  # 4.4 MB, these are ~104 KB in total. See tool/subset_fonts.py.
  fonts:
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-Regular.ttf
          weight: 400
        - asset: assets/fonts/SourceSerif4-SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
