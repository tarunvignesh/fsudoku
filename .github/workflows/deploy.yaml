name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - run: flutter pub get

      # --no-web-resources-cdn matters: by default Flutter fetches the
      # renderer from www.gstatic.com at runtime even though the build ships
      # a local copy, which makes the installed app useless offline and adds
      # a third-party dependency to every load.
      #
      # Ships the WasmGC target even though Pages cannot set COOP/COEP.
      # Measured: without those headers skwasm still loads and paints, just
      # single-threaded -- and this build is 2.2 MB gzipped against CanvasKit's
      # 3.5 MB. Browsers without WasmGC (Safari) take the JS fallback that the
      # same build already contains.
      - name: Build
        run: |
          flutter build web --release --wasm --no-web-resources-cdn \
            --base-href "/${GITHUB_REPOSITORY#*/}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
